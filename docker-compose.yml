version: '3.8'

services:
  agentic-dating:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: canda_ads_agentic_dating
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/app/data/agentic_dating.db
      - LLM_PROVIDER=deterministic
      - APIFY_API_TOKEN=${APIFY_API_TOKEN:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
